<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala de Compartilhamento</title>
    <style>
        body { 
            background-color: #36393f; 
            color: white; 
            font-family: sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        #tela-entrada {
            margin-top: 100px;
            text-align: center;
            background-color: #2f3136;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        input { 
            padding: 12px; 
            border-radius: 5px; 
            border: none; 
            font-size: 16px; 
            width: 250px; 
            outline: none; 
            margin-bottom: 15px;
        }
        button { 
            background-color: #5865F2; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold; 
            width: 100%;
        }
        button:hover { background-color: #4752C4; }
        
        /* O container onde a chamada vai rodar */
        #jitsi-container { 
            width: 100%; 
            height: 100%; 
            display: none; /* Escondido até entrar na sala */
        }
    </style>
</head>
<body>

    <!-- Tela inicial para digitar o nome da sala -->
    <div id="tela-entrada">
        <h2>Entrar na Chamada</h2>
        <p>Qualquer pessoa com o nome da sala pode entrar.</p>
        <input type="text" id="nome-sala" placeholder="Ex: SalaDeJogos123">
        <button onclick="entrarNaSala()">Entrar na Sala</button>
    </div>

    <!-- Container da chamada -->
    <div id="jitsi-container"></div>

    <!-- Importando a API do Jitsi -->
    <script src="https://meet.jit.si/external_api.js"></script>
    <script>
        function entrarNaSala() {
            const nomeDaSala = document.getElementById('nome-sala').value.trim();
            
            if (!nomeDaSala) {
                alert("Por favor, digite um nome para a sala!");
                return;
            }

            // Esconde a tela de entrada e mostra o container de vídeo
            document.getElementById('tela-entrada').style.display = 'none';
            document.getElementById('jitsi-container').style.display = 'block';

            // Configurações da chamada
            const domain = 'meet.jit.si';
            const options = {
                roomName: nomeDaSala,
                parentNode: document.querySelector('#jitsi-container'),
                configOverwrite: {
                    // Força a entrar com microfone e câmera desligados por padrão
                    startWithAudioMuted: true,
                    startWithVideoMuted: true,
                    prejoinPageEnabled: false // Pula aquela tela de "testar câmera" do Jitsi
                }
            };
            
            // Inicia a chamada
            const api = new JitsiMeetExternalAPI(domain, options);
        }
    </script>
</body>
</html>
