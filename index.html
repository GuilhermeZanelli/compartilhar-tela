<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela 1080p - Alto FPS</title>
    <style>
        body { 
            background-color: #000000; 
            color: white; 
            font-family: sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden; 
        }
        #tela-entrada {
            margin-top: 150px;
            text-align: center;
            background-color: #1e1e24;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        input { 
            padding: 12px; 
            border-radius: 5px; 
            border: none; 
            font-size: 16px; 
            width: 300px; 
            outline: none; 
            margin-bottom: 15px;
            text-align: center;
            background-color: #2b2d31;
            color: white;
        }
        button { 
            background-color: #5865F2; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold; 
            width: 100%;
        }
        button:hover { background-color: #4752C4; }
        
        #jitsi-container { 
            width: 100%; 
            height: 100%; 
            display: none; 
        }
    </style>
</head>
<body>

    <div id="tela-entrada">
        <h2>Transmissão (1080p / 244 FPS)</h2>
        <input type="text" id="nome-sala" placeholder="Digite o nome da sala...">
        <button onclick="entrarNaSala()">Conectar</button>
    </div>

    <div id="jitsi-container"></div>

    <script src="https://meet.jit.si/external_api.js"></script>
    <script>
        function entrarNaSala() {
            const nomeDaSala = document.getElementById('nome-sala').value.trim();
            if (!nomeDaSala) return;

            document.getElementById('tela-entrada').style.display = 'none';
            document.getElementById('jitsi-container').style.display = 'block';

            const domain = 'meet.jit.si';
            const options = {
                roomName: nomeDaSala,
                parentNode: document.querySelector('#jitsi-container'),
                configOverwrite: {
                    resolution: 1080,
                    constraints: {
                        video: {
                            height: { ideal: 1080, max: 1080, min: 720 },
                            // Pede ao navegador para tentar o máximo, mas se adaptar
                            frameRate: { ideal: 60, max: 244, min: 5 } 
                        }
                    },
                    // Configuração específica para captura de tela do Jitsi
                    desktopSharingFrameRate: {
                        min: 5,   // O valor baixo garante a adaptação em PCs fracos
                        max: 244  // O limite máximo que você pediu
                    },
                    
                    startWithAudioMuted: true,
                    startWithVideoMuted: true,
                    prejoinPageEnabled: false,
                    disableAudioLevels: true,
                    disableRemoteMute: true,
                    hideConferenceSubject: true,
                    hideConferenceTimer: true,
                    
                    toolbarButtons: ['desktop', 'fullscreen', 'hangup']
                },
                interfaceConfigOverwrite: {
                    DISABLE_DOMINANT_SPEAKER_INDICATOR: true,
                    DISABLE_VIDEO_BACKGROUND: true,
                    HIDE_INVITE_MORE_HEADER: true,
                    RECENT_LIST_ENABLED: false,
                    SHOW_JITSI_WATERMARK: false
                }
            };
            
            const api = new JitsiMeetExternalAPI(domain, options);
        }
    </script>
</body>
</html>
